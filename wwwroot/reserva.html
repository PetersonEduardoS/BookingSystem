<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazer Reserva</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #00b4db, #0083b0);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0083b0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background-color: #006e97;
            }

        a {
            display: block;
            margin-top: 16px;
            color: #0083b0;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fazer Reserva</h2>
        <form id="formReserva">
            <select id="usuarioId" required>
                <option value="">Selecione o usuário</option>
            </select>
            <select id="salaId" required>
                <option value="">Selecione a sala</option>
            </select>
            <input type="datetime-local" id="dataInicio" required />
            <input type="datetime-local" id="dataFim" required />
            <button type="submit">Reservar</button>
        </form>
        <a href="home.html">← Voltar</a>
    </div>

    <script>
    const API = 'https://localhost:7204/api';

    async function carregarUsuarios() {
      const res = await fetch(`${API}/usuarios`);
      const usuarios = await res.json();
      const select = document.getElementById('usuarioId');
      usuarios.forEach(u => {
        const option = document.createElement('option');
        option.value = u.id;
        option.textContent = u.nome;
        select.appendChild(option);
      });
    }

    async function carregarSalas() {
      const res = await fetch(`${API}/salas`);
      const salas = await res.json();
      const select = document.getElementById('salaId');
      salas.forEach(s => {
        const option = document.createElement('option');
        option.value = s.id;
        option.textContent = `${s.nome} (cap: ${s.capacidade})`;
        select.appendChild(option);
      });
    }

    document.getElementById('formReserva').addEventListener('submit', async (e) => {
      e.preventDefault();

      const reserva = {
        usuarioId: parseInt(document.getElementById('usuarioId').value),
        salaId: parseInt(document.getElementById('salaId').value),
        dataInicio: document.getElementById('dataInicio').value,
        dataFim: document.getElementById('dataFim').value
      };

      const response = await fetch(`${API}/reservas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reserva)
      });

      if (response.ok) {
        alert("Reserva realizada com sucesso!");
        document.getElementById('formReserva').reset();
      } else {
        const erro = await response.text();
        alert("Erro: " + erro);
      }
    });

    carregarUsuarios();
    carregarSalas();
    </script>
</body>
</html>
