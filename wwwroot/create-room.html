<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Room - Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0072ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background-color: #005acc;
            }

        a {
            display: block;
            margin-top: 16px;
            text-decoration: none;
            color: #0072ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create a New Room</h2>
        <form id="roomForm">
            <input type="text" id="roomName" placeholder="Room name" required />
            <input type="number" id="roomCapacity" placeholder="Capacity" required />
            <button type="submit">Create</button>
        </form>
        <a href="home.html">← Back to home</a>
    </div>

    <script>
    const API = 'https://localhost:7204/api'; 
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    document.getElementById('roomForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('roomName').value;
      const capacity = parseInt(document.getElementById('roomCapacity').value);

      const response = await fetch(`${API}/rooms`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ name, capacity })
      });

      if (response.ok) {
        alert("Room created successfully!");
        document.getElementById('roomForm').reset();
      } else {
        const message = await response.text();
        alert("Could not create room: " + message);
      }
    });
    </script>
</body>
</html>
