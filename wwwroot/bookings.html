<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings - Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
        }

        .booking {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

            .booking h3 {
                margin: 0 0 10px;
            }

            .booking p {
                margin: 5px 0;
            }

        a {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Bookings</h1>
    <div id="bookingList"></div>
    <a href="home.html">← Back</a>

    <script>
    const API = 'https://localhost:7204/api'; 
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    async function loadBookings() {
      const res = await fetch(`${API}/bookings`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 401) {
        window.location.href = 'index.html';
        return;
      }
      const bookings = await res.json();
      const container = document.getElementById('bookingList');
      container.innerHTML = '';

      if (bookings.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:white;">No bookings found.</p>';
        return;
      }

        bookings.forEach(r => {
            const div = document.createElement('div');
            div.className = 'booking';
            div.innerHTML = `
            <h3>${r.user.name} booked ${r.room.name}</h3>
            <p><strong>Start:</strong> ${formatDate(r.startDate)}</p>
            <p><strong>End:</strong> ${formatDate(r.endDate)}</p>
            <button onclick="deleteBooking(${r.id})" style="margin-top: 10px; background-color: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer;">
              Delete
            </button>
            <button onclick="editBooking(${r.id})" style="margin-top: 10px; background-color: #f1c40f; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-left: 10px;">
              Edit
            </button>
          `;
            container.appendChild(div);
        });

    }

    function formatDate(isoDate) {
      return new Date(isoDate).toLocaleString('en-IE');
    }

        async function deleteBooking(id) {
            if (!confirm('Are you sure you want to delete this booking?')) return;

            const response = await fetch(`${API}/bookings/${id}`, {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${token}` }
            });

            if (response.ok) {
                alert('Booking deleted successfully!');
                loadBookings(); 
            } else {
                alert('Could not delete booking.');
            }
        }

        function editBooking(id) {
            window.location.href = `edit-booking.html?id=${id}`;
        }

    loadBookings();
    </script>
</body>
</html>
