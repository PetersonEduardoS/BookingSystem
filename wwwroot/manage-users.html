<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manage Users - Booking System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3a7bd5;
            color: white;
        }

        button {
            padding: 6px 12px;
            margin-right: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #ffc107;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .logout-btn {
            margin-top: 20px;
            background-color: #ff4d4d;
            color: white;
            display: block;
            width: 150px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Manage Users</h1>

    <table id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button class="logout-btn" onclick="goToDashboard()">Back</button>


    <script>
        const API = 'https://localhost:7204/api';

        async function loadUsers() {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("You need to log in.");
                window.location.href = "index.html";
                return;
            }

            const payload = JSON.parse(atob(token.split('.')[1]));
            const role = payload["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"];
            if (role !== "admin") {
                alert("Access denied. Only administrators can access this page.");
                window.location.href = "home.html";
                return;
            }


            try {
                const res = await fetch(`${API}/users`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const users = await res.json();
                const tbody = document.querySelector("#usersTable tbody");

                users.forEach(user => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.role}</td>
                            <td>
                                <button class="edit-btn" onclick="editUser(${user.id})">Edit</button>
                                <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading users:", error);
                alert("Could not load users.");
            }
        }

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;

            const token = localStorage.getItem("token");

            try {
                await fetch(`${API}/users/${id}`, {
                    method: "DELETE",
                    headers: { Authorization: `Bearer ${token}` }
                });
                location.reload();
            } catch (error) {
                console.error("Delete error:", error);
                alert("Could not delete user.");
            }
        }

        function goToDashboard() {
            window.location.href = "home.html";
        }

        function editUser(id) {
            window.location.href = `edit-user.html?id=${id}`;
        }


        window.onload = loadUsers;
    </script>
</body>
</html>
