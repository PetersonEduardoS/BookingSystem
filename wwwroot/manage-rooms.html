<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manage Rooms - Booking System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3a7bd5;
            color: white;
        }

        button {
            padding: 6px 12px;
            margin-right: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #ffc107;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .back-btn {
            margin-top: 20px;
            background-color: #ccc;
            color: #000;
            display: block;
            width: 180px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>Manage Rooms</h1>

    <table id="roomsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Capacity</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button class="back-btn" onclick="window.location.href='home.html'">Back</button>

    <script>
        const API = "https://localhost:7204/api";

        async function loadRooms() {
            const token = localStorage.getItem("token");
            if (!token) return window.location.href = "index.html";

            const payload = JSON.parse(atob(token.split('.')[1]));
            const role = payload["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"];
            if (role !== "admin") {
                alert("Only administrators can access this page.");
                return window.location.href = "home.html";
            }

            const res = await fetch(`${API}/rooms`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            const rooms = await res.json();
            const tbody = document.querySelector("#roomsTable tbody");
            tbody.innerHTML = "";

            rooms.forEach(room => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${room.id}</td>
                    <td>${room.name}</td>
                    <td>${room.capacity}</td>
                    <td>
                        <button class="edit-btn" onclick="editRoom(${room.id})">Edit</button>
                        <button class="delete-btn" onclick="deleteRoom(${room.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function editRoom(id) {
            window.location.href = `edit-room.html?id=${id}`;
        }

        async function deleteRoom(id) {
            if (!confirm("Are you sure you want to delete this room?")) return;

            const token = localStorage.getItem("token");

            await fetch(`${API}/rooms/${id}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` }
            });

            location.reload();
        }

        window.onload = loadRooms;
    </script>
</body>
</html>
