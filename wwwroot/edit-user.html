<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Booking System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            width: 100%;
            font-size: 16px;
            background-color: #3a7bd5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            button:hover {
                background-color: #2f66be;
            }

        .back-btn {
            margin-top: 10px;
            background-color: #ccc;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit User</h2>
        <form id="editForm">
            <input type="text" id="name" placeholder="Name" required />
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="New password (optional)" />
            <select id="role">
                <option value="user">User</option>
                <option value="admin">Administrator</option>
            </select>
            <button type="submit">Save</button>
        </form>
        <button class="back-btn" onclick="window.location.href='manage-users.html'">Back</button>
    </div>

    <script>
        const API = "/api";
        const params = new URLSearchParams(window.location.search);
        const userId = params.get("id");

        async function loadUser() {
            const token = localStorage.getItem("token");
            if (!token) return window.location.href = "index.html";

            const res = await fetch(`${API}/users/${userId}`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            if (!res.ok) return alert("Could not load user.");

            const user = await res.json();
            document.getElementById("name").value = user.name;
            document.getElementById("email").value = user.email;
            document.getElementById("role").value = user.role || "user";
        }

        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");
            if (!token) return;

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            const payload = {
                name,
                email,
                role,
            };

            if (password.trim()) payload.password = password;

            try {
                const res = await fetch(`${API}/users/${userId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("User updated successfully!");
                    window.location.href = "manage-users.html";
                } else {
                    alert("Could not update user.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Could not send the request.");
            }
        });

        loadUser();
    </script>
</body>
</html>
