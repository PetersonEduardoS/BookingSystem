<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking - Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #5b86e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background-color: #417cd1;
            }

        a {
            display: block;
            margin-top: 16px;
            color: #5b86e5;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Booking</h2>
        <form id="editBookingForm">
            <select id="roomId" required></select>
            <input type="datetime-local" id="startDate" required />
            <input type="datetime-local" id="endDate" required />
            <button type="submit">Save Changes</button>
        </form>
        <a href="bookings.html">← Cancel</a>
    </div>

    <script>
    const API = '/api';
    const id = new URLSearchParams(window.location.search).get('id');
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    async function loadForm() {
      const [roomsRes, bookingRes] = await Promise.all([
        fetch(`${API}/rooms`),
        fetch(`${API}/bookings/${id}`, { headers: { Authorization: `Bearer ${token}` } })
      ]);

      if (!bookingRes.ok) {
        alert("You cannot edit this booking or it does not exist.");
        window.location.href = "bookings.html";
        return;
      }

      const rooms = await roomsRes.json();
      const booking = await bookingRes.json();

      const roomSelect = document.getElementById('roomId');
      rooms.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        if (s.id === booking.roomId) opt.selected = true;
        roomSelect.appendChild(opt);
      });

      document.getElementById('startDate').value = booking.startDate.slice(0,16);
      document.getElementById('endDate').value = booking.endDate.slice(0,16);
    }

    document.getElementById('editBookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        roomId: parseInt(document.getElementById('roomId').value),
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value
      };

      const response = await fetch(`${API}/bookings/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert("Booking updated successfully!");
        window.location.href = "bookings.html";
      } else {
        const message = await response.text();
        alert("Error: " + message);
      }
    });

    loadForm();
    </script>
</body>
</html>
