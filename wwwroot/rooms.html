<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room List - Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .room {
            background-color: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

            .room h3 {
                margin: 0 0 10px;
            }

            .room p {
                margin: 5px 0;
            }

        a {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Rooms</h1>
    <div id="roomList"></div>
    <a href="home.html">← Back</a>

    <script>
    const API = '/api';

    async function loadRooms() {
      const res = await fetch(`${API}/rooms`);
      const rooms = await res.json();
      const container = document.getElementById('roomList');
      container.innerHTML = '';

      if (rooms.length === 0) {
        container.innerHTML = '<p style="text-align:center;">No rooms yet.</p>';
        return;
      }

      rooms.forEach(s => {
        const div = document.createElement('div');
        div.className = 'room';
        div.innerHTML = `
          <h3>${s.name}</h3>
          <p><strong>Capacity:</strong> ${s.capacity}</p>
        `;
        container.appendChild(div);
      });
    }

    loadRooms();
    </script>
</body>
</html>
