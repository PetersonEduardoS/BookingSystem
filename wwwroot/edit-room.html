<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Edit Room - Booking System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #3a7bd5, #00d2ff);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            width: 100%;
            font-size: 16px;
            background-color: #3a7bd5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

            button:hover {
                background-color: #2f66be;
            }

        .back-btn {
            background-color: #ccc;
            color: black;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Edit Room</h2>
        <form id="editRoomForm">
            <input type="text" id="name" placeholder="Room name" required />
            <input type="number" id="capacity" placeholder="Capacity" min="1" required />
            <button type="submit">Save</button>
        </form>
        <button class="back-btn" onclick="window.location.href='manage-rooms.html'">Back</button>
    </div>

    <script>
        const API = "https://localhost:7204/api";
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get("id");

        async function loadRoom() {
            const token = localStorage.getItem("token");
            if (!token) return window.location.href = "index.html";

            const res = await fetch(`${API}/rooms/${roomId}`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            if (!res.ok) return alert("Room not found.");

            const room = await res.json();
            document.getElementById("name").value = room.name;
            document.getElementById("capacity").value = room.capacity;
        }

        document.getElementById("editRoomForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");
            const name = document.getElementById("name").value;
            const capacity = parseInt(document.getElementById("capacity").value);

            const payload = { id: parseInt(roomId), name, capacity };

            const res = await fetch(`${API}/rooms/${roomId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Room updated successfully!");
                window.location.href = "manage-rooms.html";
            } else {
                alert("Could not update room.");
            }
        });

        loadRoom();
    </script>
</body>
</html>
